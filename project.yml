name: iMote
options:
  bundleIdPrefix: com.slvssb.imote
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages: {}
targets:
  iMote-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOSApp
        excludes:
          - PrivacyInfo.xcprivacy
          - UI/PhoneDevicesView.swift
          - UI/PhonePreviewViews.swift
          - UI/PhoneRemoteView.swift
          - UI/PhoneSettingsView.swift
      - path: iOSApp/UI/PhoneDevicesView.swift
      - path: iOSApp/UI/PhonePreviewViews.swift
      - path: iOSApp/UI/PhoneRemoteView.swift
      - path: iOSApp/UI/PhoneSettingsView.swift
      - path: iOSApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: iMote
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: iMote discovers your Mac on the local network and connects to Macs you save, including over Tailscale.
        NSBonjourServices:
          - _rkbd._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slvssb.imote.app
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO

  iMote-Host:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOSApp
        excludes:
          - PrivacyInfo.xcprivacy
          - iMote-Host.entitlements
          - UI/HostDevicesView.swift
          - UI/HostOverviewView.swift
          - UI/HostSettingsView.swift
      - path: macOSApp/UI/HostDevicesView.swift
      - path: macOSApp/UI/HostOverviewView.swift
      - path: macOSApp/UI/HostSettingsView.swift
      - path: macOSApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: macOSApp/Info.plist
      properties:
        CFBundleDisplayName: iMote Host
        LSUIElement: false
        NSMicrophoneUsageDescription: iMote streams this Mac's microphone to your paired iPhone when you choose Mic or Both.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slvssb.imote.host
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: macOSApp/iMote-Host.entitlements
        ENABLE_HARDENED_RUNTIME: YES
