name: iPhoneKeyboard
options:
  bundleIdPrefix: com.selva.iPhoneKeyboard
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages: {}
targets:
  iPhoneKeyboard-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOSApp
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: iPhone Keyboard
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: This app discovers and connects to your Mac keyboard server on local Wi-Fi.
        NSBonjourServices:
          - _rkbd._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selva.iPhoneKeyboard.ios
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO

  iPhoneKeyboard-Mac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOSApp
    info:
      path: macOSApp/Info.plist
      properties:
        CFBundleDisplayName: iPhone Keyboard Host
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selva.iPhoneKeyboard.mac
        CODE_SIGN_STYLE: Automatic
